name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job: the "gate" ruleset requires the literal check-run
  # name, which defaults to the job id ("dependency-review") when no `name:` is
  # set. Overriding it here would rename the check run, and a required context
  # that matches nothing refuses nothing. docs/quality/check-names.md is where
  # the names and the required set are listed.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
          # What this repository may distribute a combined work under, given its
          # own licence. The list is here rather than in a document because this
          # is the copy the action reads; docs/quality/dependency-licences.md
          # argues it and does not repeat it.
          #
          # Permissive, and combinable into a copyleft work without further
          # conditions on the rest of it:
          #   0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT,
          #   Unlicense, Zlib
          # Per-file copyleft, which reaches its own files and no others, and
          # which is also what the upstream design tool is under:
          #   MPL-2.0
          # Copyleft this repository's own AGPL-3.0-only can be combined with,
          # in that direction:
          #   LGPL-3.0-only, LGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
          #   AGPL-3.0-only, AGPL-3.0-or-later
          #
          # Deliberately narrow. A licence that is absent is not thereby
          # declared incompatible; it is a change that stops here until somebody
          # decides, which is the direction a licence gate should fail in. The
          # undetermined case is not refused here at all: the action prints it
          # and passes, which docs/quality/dependency-licences.md records.
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT,
            Unlicense, Zlib, MPL-2.0, LGPL-3.0-only, LGPL-3.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
