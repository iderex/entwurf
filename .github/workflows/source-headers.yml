# Which licence each source file declares, refused by a run rather than checked at
# review. It runs on every change because a licence header is exactly the thing
# that is correct on the day it is written and missing on the file added three
# months later; a check that runs when somebody remembers is a rule nothing
# refuses.
#
# What it does not reach is printed by the run itself: the extensions it knows a
# comment syntax for, how far into a file it reads, and that it cannot judge
# whether the licence a file declares is the licence its contents may lawfully
# carry. A green run here says every source file declares the licence its location
# says, and says nothing else.
name: source-headers

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Read-only: the check reads tracked files and sets an exit status. It never
# applies a header here, because a gate that repaired the tree would hide the
# thing it exists to report.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id and the check name are the same string, for the reason the unit
  # suite gives: the check run takes its name from `name:` where one is set and
  # from the job id otherwise, so a rule naming either one keeps matching.
  source-headers:
    name: source-headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check asks git which paths are tracked, so it needs the checkout
          # to be a repository. It never pushes, so the token is not persisted.
          persist-credentials: false

      - name: Install the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Refuse a source file whose licence is missing or wrong
        # No install step: the check imports only Node builtins and files in this
        # tree, so it needs no dependency and no network.
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack pnpm run check:headers
